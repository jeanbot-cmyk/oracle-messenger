<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Reparer Oracle Messenger</title>
  <style>
    :root {
      color-scheme: light;
      --header: #102a2a;
      --brand: #1f7a5a;
      --bg: #f7faf8;
      --text: #111827;
      --muted: #52605d;
      --border: rgba(16, 42, 42, 0.14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      width: min(100%, 430px);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 18px 45px rgba(16, 42, 42, 0.12);
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      background: var(--header);
    }
    .logo img {
      width: 46px;
      height: 46px;
      border-radius: 13px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 23px;
      line-height: 1.15;
      font-weight: 900;
      color: var(--text);
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      font-weight: 650;
    }
    #status {
      min-height: 44px;
      margin: 18px 0;
      padding: 12px 14px;
      border-radius: 16px;
      background: #eaf4f1;
      color: var(--header);
      font-size: 13px;
      line-height: 1.45;
      font-weight: 850;
      text-align: left;
    }
    button, a.button {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
    }
    button {
      background: var(--brand);
      color: #fff;
      box-shadow: 0 10px 24px rgba(31, 122, 90, 0.18);
    }
    a.button {
      margin-top: 10px;
      background: #fff;
      color: var(--header);
      border: 1.5px solid var(--border);
    }
    .small {
      margin-top: 14px;
      font-size: 12px;
      color: #6b7280;
      font-weight: 650;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">
      <img src="/icons/icon-96-v20260803.png" alt="">
    </div>
    <h1>Reparation Oracle Messenger</h1>
    <p>Cette page nettoie l'ancien cache Chrome et le Service Worker bloque, puis relance l'installation.</p>
    <div id="status">Preparation du nettoyage...</div>
    <button id="resetButton" type="button">Relancer le nettoyage</button>
    <a class="button" id="installLink" href="/install?reset=manual&v=77-20260803-install-direct">Retourner a l'installation</a>
    <p class="small">Les conversations et fichiers utilisateur ne sont pas supprimes par cette operation.</p>
  </main>

  <script>
    (function () {
      var VERSION = '77-20260803-install-direct';
      var statusEl = document.getElementById('status');
      var installLink = document.getElementById('installLink');
      var button = document.getElementById('resetButton');

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function nextUrl() {
        var params = new URLSearchParams(window.location.search);
        var rawNext = params.get('next') || '/install';
        var url;
        try {
          url = new URL(rawNext, window.location.origin);
          if (url.origin !== window.location.origin) url = new URL('/install', window.location.origin);
        } catch (err) {
          url = new URL('/install', window.location.origin);
        }
        url.searchParams.set('reset', 'done');
        url.searchParams.set('v', VERSION);
        return url.toString();
      }

      function clearTechnicalStorage() {
        try {
          document.cookie = 'pwa-installed=; path=/; max-age=0; SameSite=Lax';
          localStorage.removeItem('oracle-client-cache-version');
          localStorage.removeItem('oracle-pwa-install-pending');
          sessionStorage.removeItem('oracle-install-reload-attempted');
          Object.keys(sessionStorage)
            .filter(function (key) { return key.indexOf('oracle-sw-reloaded-') === 0 || key.indexOf('oracle-install-reset-') === 0; })
            .forEach(function (key) { sessionStorage.removeItem(key); });
        } catch (err) {}
      }

      async function resetPwa() {
        button.disabled = true;
        clearTechnicalStorage();
        setStatus('Suppression des anciens caches Chrome...');

        try {
          if ('caches' in window) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (key) { return caches.delete(key); }));
          }
        } catch (err) {}

        setStatus('Desinstallation des anciens Service Workers...');
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (reg) { return reg.unregister(); }));
          }
        } catch (err) {}

        setStatus('Nettoyage termine. Redirection vers l'installation...');
        installLink.href = nextUrl();
        setTimeout(function () {
          window.location.replace(nextUrl());
        }, 900);
      }

      button.addEventListener('click', resetPwa);
      installLink.href = nextUrl();
      resetPwa().catch(function () {
        button.disabled = false;
        setStatus("Nettoyage partiel. Appuie sur le bouton, puis rouvre Chrome si necessaire.");
      });
    })();
  </script>
</body>
</html>
