name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  android-apk:
    name: Build Capacitor APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_BACKEND_URL: https://api-messenger.oracle-plus.online
      CAPACITOR_ANDROID_STUDIO_PATH: /usr/bin/true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js frontend
        run: npm run build

      - name: Prepare Capacitor web directory
        run: |
          mkdir -p out
          cat > out/index.html <<'HTML'
          <!doctype html>
          <html lang="fr">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Oracle Messenger</title>
            </head>
            <body>
              <script>
                location.replace("https://messenger.oracle-plus.online");
              </script>
            </body>
          </html>
          HTML

      - name: Copy Capacitor assets and config
        run: npx cap copy android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: frontend/android

      - name: Build release APK unsigned
        run: ./gradlew assembleRelease
        working-directory: frontend/android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oracle-messenger-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: oracle-messenger-release-unsigned-apk
          path: frontend/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
