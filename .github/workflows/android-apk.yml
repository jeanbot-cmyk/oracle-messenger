name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  android-apk:
    name: Build Capacitor Android
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_BACKEND_URL: https://api-messenger.oracle-plus.online
      CAPACITOR_ANDROID_STUDIO_PATH: /usr/bin/true
      ORACLE_MESSENGER_VERSION_CODE: ${{ github.run_number }}
      ORACLE_MESSENGER_VERSION_NAME: 1.0.${{ github.run_number }}
      ORACLE_MESSENGER_KEYSTORE_BASE64: ${{ secrets.ORACLE_MESSENGER_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
        working-directory: .

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js frontend
        run: npm run build

      - name: Prepare Capacitor web directory
        run: |
          mkdir -p out
          cat > out/index.html <<'HTML'
          <!doctype html>
          <html lang="fr">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Oracle Messenger</title>
            </head>
            <body>
              <script>
                location.replace("https://messenger.oracle-plus.online");
              </script>
            </body>
          </html>
          HTML

      - name: Copy Capacitor assets and config
        run: npx cap copy android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Decode Android upload keystore
        if: ${{ env.ORACLE_MESSENGER_KEYSTORE_BASE64 != '' }}
        env:
          ORACLE_MESSENGER_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_MESSENGER_KEYSTORE_PASSWORD }}
          ORACLE_MESSENGER_KEY_ALIAS: ${{ secrets.ORACLE_MESSENGER_KEY_ALIAS }}
          ORACLE_MESSENGER_KEY_PASSWORD: ${{ secrets.ORACLE_MESSENGER_KEY_PASSWORD }}
        run: |
          test -n "$ORACLE_MESSENGER_KEYSTORE_PASSWORD" || { echo "Missing ORACLE_MESSENGER_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ORACLE_MESSENGER_KEY_ALIAS" || { echo "Missing ORACLE_MESSENGER_KEY_ALIAS"; exit 1; }
          test -n "$ORACLE_MESSENGER_KEY_PASSWORD" || { echo "Missing ORACLE_MESSENGER_KEY_PASSWORD"; exit 1; }
          printf '%s' "$ORACLE_MESSENGER_KEYSTORE_BASE64" | base64 --decode > android/app/oracle-messenger-upload.jks

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: frontend/android

      - name: Build release APK unsigned
        if: ${{ env.ORACLE_MESSENGER_KEYSTORE_BASE64 == '' }}
        run: ./gradlew assembleRelease
        working-directory: frontend/android

      - name: Build signed release APK
        if: ${{ env.ORACLE_MESSENGER_KEYSTORE_BASE64 != '' }}
        env:
          ORACLE_MESSENGER_KEYSTORE_FILE: ${{ github.workspace }}/frontend/android/app/oracle-messenger-upload.jks
          ORACLE_MESSENGER_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_MESSENGER_KEYSTORE_PASSWORD }}
          ORACLE_MESSENGER_KEY_ALIAS: ${{ secrets.ORACLE_MESSENGER_KEY_ALIAS }}
          ORACLE_MESSENGER_KEY_PASSWORD: ${{ secrets.ORACLE_MESSENGER_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
        working-directory: frontend/android

      - name: Build unsigned Play Store AAB
        if: ${{ env.ORACLE_MESSENGER_KEYSTORE_BASE64 == '' }}
        run: ./gradlew bundleRelease
        working-directory: frontend/android

      - name: Build signed Play Store AAB
        if: ${{ env.ORACLE_MESSENGER_KEYSTORE_BASE64 != '' }}
        env:
          ORACLE_MESSENGER_KEYSTORE_FILE: ${{ github.workspace }}/frontend/android/app/oracle-messenger-upload.jks
          ORACLE_MESSENGER_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_MESSENGER_KEYSTORE_PASSWORD }}
          ORACLE_MESSENGER_KEY_ALIAS: ${{ secrets.ORACLE_MESSENGER_KEY_ALIAS }}
          ORACLE_MESSENGER_KEY_PASSWORD: ${{ secrets.ORACLE_MESSENGER_KEY_PASSWORD }}
        run: ./gradlew bundleRelease
        working-directory: frontend/android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oracle-messenger-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: oracle-messenger-release-apk
          path: frontend/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: oracle-messenger-playstore-aab
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
