name: Build Native Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "native-messenger/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  native-android:
    name: Build React Native Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: native-messenger

    env:
      ORACLE_MESSENGER_KEYSTORE_BASE64: ${{ secrets.ORACLE_MESSENGER_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null
        working-directory: .

      - name: Install Android packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.1.12297006"
        working-directory: .

      - name: Install native dependencies
        run: npm install --legacy-peer-deps

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify Android release config
        run: npm run verify:android-release-config

      - name: Build debug APK arm64
        run: npm run android:assemble-debug-arm64

      - name: Decode Android upload keystore
        if: ${{ env.ORACLE_MESSENGER_KEYSTORE_BASE64 != '' }}
        env:
          ORACLE_MESSENGER_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_MESSENGER_KEYSTORE_PASSWORD }}
          ORACLE_MESSENGER_KEY_ALIAS: ${{ secrets.ORACLE_MESSENGER_KEY_ALIAS }}
          ORACLE_MESSENGER_KEY_PASSWORD: ${{ secrets.ORACLE_MESSENGER_KEY_PASSWORD }}
        run: |
          test -n "$ORACLE_MESSENGER_KEYSTORE_PASSWORD" || { echo "Missing ORACLE_MESSENGER_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ORACLE_MESSENGER_KEY_ALIAS" || { echo "Missing ORACLE_MESSENGER_KEY_ALIAS"; exit 1; }
          test -n "$ORACLE_MESSENGER_KEY_PASSWORD" || { echo "Missing ORACLE_MESSENGER_KEY_PASSWORD"; exit 1; }
          mkdir -p .release
          printf '%s' "$ORACLE_MESSENGER_KEYSTORE_BASE64" | base64 --decode > .release/oracle-messenger-upload.jks

      - name: Build signed Play Store AAB
        if: ${{ env.ORACLE_MESSENGER_KEYSTORE_BASE64 != '' }}
        env:
          ORACLE_MESSENGER_KEYSTORE_FILE: ${{ github.workspace }}/native-messenger/.release/oracle-messenger-upload.jks
          ORACLE_MESSENGER_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_MESSENGER_KEYSTORE_PASSWORD }}
          ORACLE_MESSENGER_KEY_ALIAS: ${{ secrets.ORACLE_MESSENGER_KEY_ALIAS }}
          ORACLE_MESSENGER_KEY_PASSWORD: ${{ secrets.ORACLE_MESSENGER_KEY_PASSWORD }}
        run: npm run android:production-release

      - name: Report missing release signing
        if: ${{ env.ORACLE_MESSENGER_KEYSTORE_BASE64 == '' }}
        run: |
          echo "Skipping signed AAB because ORACLE_MESSENGER_KEYSTORE_BASE64 is not configured."
          echo "Debug APK is for device smoke tests only, not Play Store production."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oracle-messenger-native-debug-apk
          path: native-messenger/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Play Store AAB
        if: ${{ env.ORACLE_MESSENGER_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: oracle-messenger-native-playstore-aab
          path: native-messenger/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
